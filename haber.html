<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haber — Hezarfen Tekno Team</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1929; --navy-mid:#122c46; --navy-line: rgba(90,200,224,0.16);
    --cyan:#5ac8e0; --paper:#ede7d9; --paper-dim:#d9d2c0; --steel:#8d99a6; --red:#c81e2c; --green:#4caf7d; --white:#f7f5ef;
    --display:'Big Shoulders Display',sans-serif; --body:'Source Serif 4',Georgia,serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--paper); color:var(--navy-deep); font-family:var(--body); line-height:1.7; }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid var(--red); outline-offset:3px; }

  header{ background:var(--navy-deep); border-bottom:1px solid var(--navy-line); }
  .nav-inner{
    max-width:800px; margin:0 auto; padding:0 24px; height:72px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo-img{ height:40px; }
  .back-link{ font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--steel); }
  .back-link:hover{ color:var(--cyan); }

  .wrap{ max-width:720px; margin:0 auto; padding:56px 24px 100px; }
  .art-date{ font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:#0a7a91; text-transform:uppercase; }
  h1{ font-family:var(--display); font-weight:800; font-size:clamp(30px,5vw,46px); margin-top:14px; line-height:1.05; }
  .art-img{ width:100%; border-radius:2px; margin-top:30px; display:block; }
  .art-body{ margin-top:30px; font-size:17px; white-space:pre-wrap; }

  .reactions{
    display:flex; align-items:center; gap:14px; margin-top:44px; padding-top:24px;
    border-top:1px solid rgba(10,25,41,0.15);
  }
  .react-btn{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:13px; letter-spacing:0.04em;
    border:1px solid rgba(10,25,41,0.25); background:transparent; color:var(--navy-deep);
    padding:9px 16px; cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .react-btn svg{ width:17px; height:17px; }
  .react-btn:hover{ border-color:var(--red); }
  .react-btn.active{ background:var(--navy-deep); color:var(--white); border-color:var(--navy-deep); }

  .share-row{ margin-top:26px; }
  .share-label{ font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--steel); margin-bottom:12px; }
  .share-icons{ display:flex; flex-wrap:wrap; gap:10px; }
  .share-icons button, .share-icons a{
    width:40px; height:40px; border:1px solid rgba(10,25,41,0.2);
    display:flex; align-items:center; justify-content:center;
    background:var(--white); cursor:pointer; color:var(--navy-deep);
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .share-icons button:hover, .share-icons a:hover{ background:var(--navy-deep); color:var(--cyan); transform:translateY(-2px); }
  .share-icons svg{ width:19px; height:19px; }

  .comments{ margin-top:56px; }
  .comments h3{ font-family:var(--display); font-size:24px; font-weight:700; margin-bottom:20px; }
  #commentForm{ display:flex; flex-direction:column; gap:12px; margin-bottom:36px; }
  #commentForm input, #commentForm textarea{
    background:var(--white); border:1px solid rgba(10,25,41,0.2);
    font-family:var(--body); font-size:15px; padding:11px 13px; color:var(--navy-deep);
  }
  #commentForm textarea{ resize:vertical; }
  #commentForm button{
    align-self:flex-start; font-family:var(--mono); font-size:13px; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--red); color:var(--white); border:none; padding:12px 22px; cursor:pointer;
  }
  #commentForm button:hover{ background:#e13343; }
  .comment-item{ border-bottom:1px solid rgba(10,25,41,0.12); padding:16px 0; }
  .comment-item .c-name{ font-family:var(--mono); font-size:12.5px; font-weight:600; color:#0a7a91; }
  .comment-item .c-date{ font-family:var(--mono); font-size:10.5px; color:var(--steel); margin-left:8px; }
  .comment-item p{ font-size:14.5px; margin-top:6px; }
  .comment-empty{ font-family:var(--mono); font-size:13px; color:var(--steel); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy-deep); color:var(--white); font-family:var(--mono); font-size:12.5px;
    padding:12px 20px; border-radius:2px; opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <img src="assets/logo.png" alt="Hezarfen Tekno Team logosu" class="logo-img">
    <a href="index.html#haberler" class="back-link">← Tüm Haberler</a>
  </div>
</header>

<div class="wrap" id="articleWrap">
  <div class="art-date" id="artDate">Yükleniyor...</div>
  <h1 id="artTitle"></h1>
  <img id="artImg" class="art-img" style="display:none;">
  <div class="art-body" id="artBody"></div>

  <div class="reactions">
    <button class="react-btn" id="likeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Zm0 0 4.5-8a2 2 0 0 1 3.5 1.3V9h4.2a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 18 20H7"/></svg>
      <span id="likeCount">0</span>
    </button>
    <button class="react-btn" id="dislikeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 13V4h3a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-3Zm0 0-4.5 8a2 2 0 0 1-3.5-1.3V15H4.8a2 2 0 0 1-2-2.4l1.4-7A2 2 0 0 1 6.2 4H17"/></svg>
      <span id="dislikeCount">0</span>
    </button>
  </div>

  <div class="share-row">
    <div class="share-label">Paylaş</div>
    <div class="share-icons" id="shareIcons">
      <a id="shareWhatsapp" target="_blank" rel="noopener" title="WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20l1.3-4A8 8 0 1 1 9 18.7L4 20Z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6" /></svg></a>
      <button id="shareInstagram" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/></svg></button>
      <a id="shareLinkedin" target="_blank" rel="noopener" title="LinkedIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><line x1="7.5" y1="10" x2="7.5" y2="16.5"/><circle cx="7.5" cy="7" r="0.9" fill="currentColor" stroke="none"/><path d="M11 16.5v-4.2c0-1.4 1-2.3 2.2-2.3 1.2 0 2.1.9 2.1 2.3v4.2"/><line x1="11" y1="10.3" x2="11" y2="16.5"/></svg></a>
      <a id="shareMail" title="E-posta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 6.5 12 13 20 6.5"/></svg></a>
      <a id="shareSnapchat" target="_blank" rel="noopener" title="Snapchat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4c-2.8 0-4.6 2-4.6 4.6 0 1 .1 1.9-.2 2.6-.4.8-1.4 1.1-2.2 1.4-.3.1-.3.6.1.8.6.3 1.3.4 1.3.8s-.6.6-.9 1.1c-.2.4.1.7.5.7 1 0 1.5.4 2.1 1 .8.8 1.9 1.4 3.9 1.4s3.1-.6 3.9-1.4c.6-.6 1.1-1 2.1-1 .4 0 .7-.3.5-.7-.3-.5-.9-.7-.9-1.1s.7-.5 1.3-.8c.4-.2.4-.7.1-.8-.8-.3-1.8-.6-2.2-1.4-.3-.7-.2-1.6-.2-2.6C16.6 6 14.8 4 12 4Z"/></svg></a>
      <a id="shareTelegram" target="_blank" rel="noopener" title="Telegram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m3 11 17-7-5 17-5.5-6-4-1.5Z"/><path d="m9.5 14.5 8.5-9.5-11 7.5"/></svg></a>
      <a id="shareTwitter" target="_blank" rel="noopener" title="X (Twitter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l16 16M20 4 4 20"/></svg></a>
    </div>
  </div>

  <div class="comments">
    <h3>Yorumlar</h3>
    <form id="commentForm">
      <input type="text" id="cName" placeholder="Adınız" required maxlength="60">
      <textarea id="cText" rows="3" placeholder="Yorumunuz..." required maxlength="600"></textarea>
      <button type="submit">Yorum Yap</button>
      <p class="msg" id="commentMsg" style="font-family:var(--mono); font-size:12px;"></p>
    </form>
    <div id="commentList"><p class="comment-empty">Yorumlar yükleniyor...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCefL0FpIDpKPh4RZfqbuGfGlecEafjFMI",
    authDomain: "hezarfen-kariyer.firebaseapp.com",
    projectId: "hezarfen-kariyer",
    storageBucket: "hezarfen-kariyer.firebasestorage.app",
    messagingSenderId: "604464908716",
    appId: "1:604464908716:web:7796b35cb3ccb47c7f1209"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const params = new URLSearchParams(window.location.search);
  const newsId = params.get('id');
  const toast = document.getElementById('toast');
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  if (!newsId) {
    document.getElementById('articleWrap').innerHTML = '<p>Haber bulunamadı.</p>';
  } else {
    const newsRef = db.collection('news').doc(newsId);

    // Load article
    newsRef.get().then(doc => {
      if (!doc.exists) {
        document.getElementById('articleWrap').innerHTML = '<p>Bu haber artık mevcut değil.</p>';
        return;
      }
      const n = doc.data();
      document.title = (n.title || 'Haber') + ' — Hezarfen Tekno Team';
      document.getElementById('artDate').textContent = n.createdAt && n.createdAt.toDate ? n.createdAt.toDate().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      document.getElementById('artTitle').textContent = n.title || '';
      document.getElementById('artBody').textContent = n.body || '';
      if (n.imageUrl) {
        const img = document.getElementById('artImg');
        img.src = n.imageUrl; img.alt = n.title || ''; img.style.display = 'block';
      }
      document.getElementById('likeCount').textContent = n.likes || 0;
      document.getElementById('dislikeCount').textContent = n.dislikes || 0;

      const reacted = localStorage.getItem('hezarfen_reacted_' + newsId);
      if (reacted === 'like') document.getElementById('likeBtn').classList.add('active');
      if (reacted === 'dislike') document.getElementById('dislikeBtn').classList.add('active');

      // Share links (built after article load so title/url are ready)
      const shareUrl = window.location.href;
      const shareText = n.title || 'Hezarfen Tekno Team';
      document.getElementById('shareWhatsapp').href = `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;
      document.getElementById('shareLinkedin').href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;
      document.getElementById('shareMail').href = `mailto:?subject=${encodeURIComponent(shareText)}&body=${encodeURIComponent(shareUrl)}`;
      document.getElementById('shareSnapchat').href = `https://www.snapchat.com/scan?attachmentUrl=${encodeURIComponent(shareUrl)}`;
      document.getElementById('shareTelegram').href = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`;
      document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`;
      document.getElementById('shareInstagram').addEventListener('click', () => {
        navigator.clipboard.writeText(shareUrl).then(() => showToast('Bağlantı kopyalandı — Instagram\'da paylaşabilirsiniz.'));
      });
    });

    // Like / Dislike (one vote per browser, switchable)
    async function react(type) {
      const key = 'hezarfen_reacted_' + newsId;
      const prev = localStorage.getItem(key);
      if (prev === type) return; // already this reaction
      try {
        await db.runTransaction(async (tx) => {
          const doc = await tx.get(newsRef);
          const data = doc.data() || {};
          let likes = data.likes || 0, dislikes = data.dislikes || 0;
          if (prev === 'like') likes = Math.max(0, likes - 1);
          if (prev === 'dislike') dislikes = Math.max(0, dislikes - 1);
          if (type === 'like') likes += 1;
          if (type === 'dislike') dislikes += 1;
          tx.update(newsRef, { likes, dislikes });
        });
        localStorage.setItem(key, type);
        const doc = await newsRef.get();
        const data = doc.data();
        document.getElementById('likeCount').textContent = data.likes || 0;
        document.getElementById('dislikeCount').textContent = data.dislikes || 0;
        document.getElementById('likeBtn').classList.toggle('active', type === 'like');
        document.getElementById('dislikeBtn').classList.toggle('active', type === 'dislike');
      } catch (err) {
        showToast('Bir şeyler ters gitti, tekrar deneyin.');
      }
    }
    document.getElementById('likeBtn').addEventListener('click', () => react('like'));
    document.getElementById('dislikeBtn').addEventListener('click', () => react('dislike'));

    // Comments
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    async function loadComments() {
      const listEl = document.getElementById('commentList');
      const snap = await newsRef.collection('comments').orderBy('createdAt', 'asc').get();
      if (snap.empty) { listEl.innerHTML = '<p class="comment-empty">Henüz yorum yok — ilk yorumu siz yapın.</p>'; return; }
      listEl.innerHTML = '';
      snap.forEach(doc => {
        const c = doc.data();
        const date = c.createdAt && c.createdAt.toDate ? c.createdAt.toDate().toLocaleDateString('tr-TR') : '';
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `<span class="c-name">${escapeHtml(c.name || 'Anonim')}</span><span class="c-date">${date}</span><p>${escapeHtml(c.comment || '')}</p>`;
        listEl.appendChild(item);
      });
    }
    loadComments();

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('commentMsg');
      const name = document.getElementById('cName').value.trim();
      const comment = document.getElementById('cText').value.trim();
      if (!name || !comment) return;
      msg.textContent = 'Gönderiliyor...';
      try {
        await newsRef.collection('comments').add({
          name, comment, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('commentForm').reset();
        msg.textContent = '';
        loadComments();
      } catch (err) {
        msg.textContent = 'Yorum gönderilemedi, lütfen tekrar deneyin.';
      }
    });
  }
</script>
</body>
</html>
